name: Fetch USPTO trademark candidates

on:
  schedule:
    # Daily ~10:00 UTC — after USPTO publishes the daily file (~04:09 UTC).
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch trademark candidates
        env:
          USPTO_API_KEY: ${{ secrets.USPTO_API_KEY }}
        run: |
          python worker/fetch_uspto.py

      - name: Commit results
        run: |
          git config user.name "nfa-fetch-bot"
          git config user.email "nfa-fetch-bot@users.noreply.github.com"
          git add uspto/results-*.json uspto/rejects-*.jsonl uspto/processed.txt
          git commit -m "uspto candidates $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase && git push
