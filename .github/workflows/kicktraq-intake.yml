name: Kicktraq intake fetch
run-name: Kicktraq RSS fetch

on:
  schedule:
    # Every 15 minutes, matching the local cron cadence
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Kicktraq campaigns
        run: |
          python kicktraq/kicktraq_fetch.py --out kicktraq/latest.json
          echo "Fetched $(python3 -c "import json; print(json.load(open('kicktraq/latest.json'))['count'])") campaigns"

      - name: Commit results
        run: |
          git config user.name "nfa-intake-bot"
          git config user.email "nfa-intake-bot@users.noreply.github.com"
          git add kicktraq/latest.json
          git commit -m "kicktraq intake $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              echo "committed on attempt $attempt"
              break
            fi
            echo "push attempt $attempt failed; retrying"
            sleep 5
          done
